name: build

# Builds the MIRLO 64 core: Quartus fit + compile of the bitstream, producing
# `mirlo.rev` as an artifact. Called by the release workflow on tags and run on
# pushes to main / manual dispatch.
#
# Secrets needed:
#   ASSETS_TOKEN  - token for the private repo holding the Quartus Prime Lite
#                   installer (see .github/scripts/install_quartus.sh)
#   ASSETS_REPO / ASSETS_TAG - override the installer repo/release
#                             (defaults: ollisulopuisto/mirlo64-quartus-assets / q25.1)

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Ref to build: branch, tag or commit sha"
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref }}

      - name: Install Quartus Prime Lite 25.1std (+ Cyclone V)
        run: bash .github/scripts/install_quartus.sh
        env:
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
          ASSETS_REPO: ${{ secrets.ASSETS_REPO || 'ollisulopuisto/mirlo64-quartus-assets' }}
          ASSETS_TAG: ${{ secrets.ASSETS_TAG || 'q25.1' }}

      - name: Install the MIPS toolchain and Python deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends mips-linux-gnu-gcc
          python3 -m pip install --quiet meson ninja

      - name: Host-side build (runtime, boot ROM, images)
        run: bash .github/scripts/prep.sh

      - name: Fit and compile the bitstream (recorded seed)
        id: fit
        run: |
          set -euo pipefail
          seed=$(python3 tools/fits.py seed)
          tools/fits.py check \
            || echo "build: the recorded fit is for other sources -- a seed sweep is due; trying the recorded seed anyway"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          WAIT=1 tools/area2/fit.sh release "$seed"
          if ! tools/fits.py verify projects_a2_release; then
            echo "build: seed $seed does not close timing with these sources: no bitstream."
            echo "Run a seed sweep (tools/area2/fit.sh) and record it (tools/fits.py record projects_a2_release)."
            exit 1
          fi

      - name: Package the bitstream (mirlo.rev)
        run: python3 tools/package_bitstream.py projects_a2_release/output_files/mirlo.rbf mirlo.rev

      - name: Upload the bitstream artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitstream
          path: mirlo.rev
          retention-days: 30

      - name: Build summary
        run: |
          echo "## MIRLO 64 build" >> "$GITHUB_STEP_SUMMARY"
          echo "Ref: ${{ inputs.ref || github.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Fitter seed: ${{ steps.fit.outputs.seed }}" >> "$GITHUB_STEP_SUMMARY"
          grep -h "Logic utilization" projects_a2_release/output_files/mirlo.fit.summary \
            >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
