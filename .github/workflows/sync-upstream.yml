name: Sync upstream
# Keeps this fork's branches current with tortugaveloz/MIRLO64 every day, without a build (tools/sync_upstream.sh):
#   main            a fast-forward of upstream's main (a plain mirror: the fork's own work lives on the other branches)
#   patched-v0.1    main merged in;  dpad-ramp: patched-v0.1 merged in;  fork-patches: dpad-ramp merged in
# The chain stops at the first conflict and opens an issue naming the files. A merge that changes the hardware's sources
# says "FIT NEEDED" in the report (a seed sweep: tools/winfit/fit.py, or this workflow's build, run by hand).
# A scheduled workflow runs from the default branch: this file must be on it (patched-v0.1), and the default branch has to be set
# in the repository's settings. A merge that brings in a change to .github/workflows needs a token with the "workflow" scope:
# put one in the repository secret SYNC_TOKEN, else such a push is refused and the run says so.
# Upstream's own scheduled workflow (Nightly) would build and fail here at every midnight: it is disabled by the last step.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      - name: Merge upstream down the branches
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "sync-upstream"
          git config user.email "noreply@github.com"
          git remote add upstream https://github.com/tortugaveloz/MIRLO64.git
          git checkout -q patched-v0.1
          set +e
          PUSH=1 bash tools/sync_upstream.sh 2>&1 | tee report.txt
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: An issue for a conflict, or a refused push
        if: steps.sync.outputs.rc != '0' || contains(steps.sync.outputs.rc, '1')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Upstream sync stopped ($(date +%F))" --body "$(printf 'tools/sync_upstream.sh:\n\n```\n%s\n```\n\nMerge by hand, then run this workflow again.' "$(cat report.txt)")" || true
      - name: Disable upstream's Nightly workflow in this fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable Nightly || true
